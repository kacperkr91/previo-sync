name: KSeF Sync Backfill

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Data początkowa backfillu (RRRR-MM-DD). Zostaw domyślną, jeśli nie wiesz co wpisać."
        required: false
        default: "2026-03-01"
      date_to:
        description: "Data końcowa backfillu (RRRR-MM-DD). Puste = do dzisiaj. Użyj do celowanego doganiania konkretnego okresu bez przeciągania całego zakresu do dziś."
        required: false
        default: ""
      query_wait:
        description: "Bazowa pauza (sekundy) przed ponowieniem po 429 od KSeF. Zwiększ dla uporczywie odrzucanych zakresów."
        required: false
        default: "15"
      query_retries:
        description: "Liczba prób ponowienia zapytania po 429, zanim zakres zostanie pominięty."
        required: false
        default: "4"
      chunk_delay:
        description: "Dodatkowa pauza (sekundy) PO każdym zakresie (udanym i pominiętym), żeby nie wyczerpywać skumulowanego limitu KSeF w gęstych okresach. 0 = wyłączone."
        required: false
        default: "0"

# Ten sam "group" co w ksef_sync.yml — oba workflow'y czytają i nadpisują
# całą zakładkę KSeF, więc nie mogą działać w tym samym czasie (to był jeden
# z głównych powodów znikania starych faktur: nakładające się przebiegi
# nadpisywały nawzajem swoje zmiany). cancel-in-progress: false, żeby nowo
# wywołany run CZEKAŁ w kolejce zamiast przerywać zapis w toku.
concurrency:
  group: ksef-sheet-sync
  cancel-in-progress: false

jobs:
  ksef-sync-backfill:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Warsaw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests cryptography "ksef-client"

      - name: Run KSeF backfill
        env:
          KSEF_TOKEN:             ${{ secrets.KSEF_TOKEN }}
          KSEF_SPREADSHEET_ID:    ${{ secrets.KSEF_SPREADSHEET_ID }}
          GS_SA_JSON_B64:         ${{ secrets.GS_SA_JSON_B64 }}
          KSEF_MODE:              backfill
          KSEF_DATE_FROM:         ${{ github.event.inputs.date_from || '2026-03-01' }}
          KSEF_DATE_TO:           ${{ github.event.inputs.date_to || '' }}
          KSEF_QUERY_CHUNK_DAYS:  3
          KSEF_QUERY_RETRIES:     ${{ github.event.inputs.query_retries || '4' }}
          KSEF_QUERY_WAIT:        ${{ github.event.inputs.query_wait || '15' }}
          KSEF_QUERY_CHUNK_DELAY: ${{ github.event.inputs.chunk_delay || '0' }}
          KSEF_SKIP_FAILED_CHUNKS: 1
          KSEF_XML_ONLY_MISSING:  1
          KSEF_XML_MAX_FETCH:     120
        run: python ksef_sync.py
