name: Parking Sync

on:
  schedule:
    # Godziny w UTC: 6:00-18:xx UTC = 8:00-20:xx czasu letniego / 7:00-19:xx zimowego
    # Pn i pt: co godzinę
    - cron: '0 6-18 * * 1,5'
    # Wt, śr, czw: co 30 minut (wtedy zwykle przychodzą zestawienia ZDMK)
    - cron: '*/30 6-18 * * 2-4'
  workflow_dispatch:  # Możliwość uruchomienia ręcznie

jobs:
  parking-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth google-api-python-client

      - name: Run parking sync
        env:
          # Te same dane OAuth co Previo/Invoice Mail Sync (skrzynka oldtownvistula@gmail.com,
          # gdzie trafiaja maile "Stany kart"). Stary GMAIL_REFRESH_TOKEN wygasl.
          GMAIL_CLIENT_ID:      ${{ secrets.INVOICE_GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET:  ${{ secrets.INVOICE_GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN:  ${{ secrets.INVOICE_GMAIL_REFRESH_TOKEN }}
          PARKING_SPREADSHEET_ID: ${{ secrets.PARKING_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python parking_sync.py
